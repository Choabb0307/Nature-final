<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>自然轉譯 期末原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: quiet night lab, like a sensor monitor in a dark exhibition room
IDEA: the touch-sensor installation itself — a monitor above, physical pads below
PICTURE: six nature fragments as blue point clouds that glitch into their real form when touched
COLOUR and TYPE: near-black #05070d, point blue #3d6bff, glitch lime #c8ff4a, each phenomenon's own colour when revealed; Noto Sans TC
LAYOUT: phone first — monitor canvas, data strip with time scrubber, 3x2 pad grid; side by side above 900px
*/
:root{color-scheme:dark;--bg:#05070d;--panel:#0b0f1a;--line:#1a2236;--ink:#e8ecf5;--dim:#8a93a8;--blue:#3d6bff;--lime:#c8ff4a}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;min-height:100dvh;max-width:1240px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 16px 8px}
h1{font-size:20px;line-height:1.1;margin:0;font-weight:700}
header p{margin:0;color:var(--dim);font-size:13px}
.fig{position:relative;min-height:46vh;margin:0 10px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#0a1020,#03050a)}
.fig canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:12px;top:10px;font-size:13px;color:var(--dim);pointer-events:none}
.hud b{display:block;font-size:34px;line-height:1;color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.data{padding:12px 16px 4px;display:grid;gap:10px}
.tl{display:flex;align-items:center;gap:10px}
.tl button{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:16px;cursor:pointer}
.tl button:focus-visible,.pad:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
input[type=range]{flex:1;accent-color:var(--blue);height:44px}
.metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.m{font-size:13px;color:var(--dim)}
.m span{display:block;color:var(--ink);font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.m i{display:block;height:3px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}
.m i::after{content:"";display:block;height:100%;width:var(--w,0%);background:var(--blue)}
.pads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px 16px 16px}
.pad{position:relative;min-height:84px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,#121829,#0a0e18);color:var(--ink);font:inherit;text-align:left;padding:10px 12px;cursor:pointer;touch-action:manipulation;user-select:none;transition:transform .08s,box-shadow .2s,border-color .2s}
.pad strong{display:block;font-size:17px}
.pad small{display:block;color:var(--dim);font-size:13px;line-height:1.35}
.pad kbd{position:absolute;right:10px;top:8px;font:13px "Noto Sans TC";color:var(--dim)}
.pad.on{transform:scale(.97);border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 26px -4px var(--c)}
.note{color:var(--dim);font-size:13px;padding:0 16px 14px}
@media(min-width:900px){
 .app{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;column-gap:8px}
 header{grid-column:1/-1}.fig{grid-row:2/4;min-height:70vh}
 .data{grid-column:2}.pads{grid-column:2;align-content:start}.note{grid-column:1/-1}
}
@media(max-width:420px){.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.pad{min-height:76px;padding:9px 10px}.pad strong{font-size:16px}}
@media(prefers-reduced-motion:reduce){.pad{transition:none}}
</style>
</head>
<body>
<div class="app">
 <header><h1>身處其中 · 自然轉譯</h1><p>期末作品互動原型</p></header>
 <div class="fig" id="fig"><canvas id="cv"></canvas><div class="hud"><b id="clock">00:00</b><span id="sky">夜</span></div></div>
 <section class="data">
  <div class="tl"><button id="play" aria-label="播放或暫停">❚❚</button><input id="hour" type="range" min="0" max="23.99" step="0.01" value="5" aria-label="時間"></div>
  <div class="metrics" id="metrics"></div>
 </section>
 <section class="pads" id="pads"></section>
 <p class="note">示範資料：模擬的台北十一月某日 24 小時氣象紀錄。點按鍵或按鍵盤 1 到 6 觸發，正式版會換成感測器輸入與真實紀錄。</p>
</div>
<script>
{
const D={temp:[18.2,18,17.8,17.6,17.5,17.4,17.6,18.1,18.9,19.8,20.6,21.3,21.8,22,21.7,21.1,20.3,19.6,19.1,18.8,18.6,18.4,18.3,18.2],
rain:[0,0,.2,.6,1.4,2.1,1.2,.5,.1,0,0,0,0,0,0,0,0,.3,.8,.4,0,0,0,0],
cloud:[88,90,95,98,100,100,97,92,85,74,66,58,52,50,55,63,72,85,93,95,90,86,84,86],
wind:[2.1,2.3,2.8,3.6,4.4,5.2,4.8,4.1,3.5,3.2,3,3.4,3.9,4.2,4,3.6,3.1,3.8,4.6,4.1,3.2,2.6,2.3,2.2],
rad:[0,0,0,0,0,0,8,60,150,260,350,410,430,400,320,210,90,15,0,0,0,0,0,0]};
const MET=[["temp","溫度","°C",15,25],["rain","雨量","mm",0,3],["cloud","雲量","%",0,100],["wind","風速","m/s",0,7],["rad","日照","W/m²",0,500]];
const val=(k,h)=>{const a=D[k],i=Math.floor(h)%24,j=(i+1)%24,f=h-Math.floor(h);return a[i]+(a[j]-a[i])*f};
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const norm=(k,h)=>{const m=MET.find(r=>r[0]==k);return cl((val(k,h)-m[3])/(m[4]-m[3]))};

/* shapes, drawn at unit size s, centred on 0,0 */
const P=Math.PI;
const shapes={
 leaf(c,s,a){c.beginPath();c.moveTo(0,-s);c.quadraticCurveTo(s*.85,-s*.15,0,s*.85);c.quadraticCurveTo(-s*.85,-s*.15,0,-s);c.fill();
  c.fillRect(-s*.03,s*.75,s*.06,s*.35)},
 rain(c,s){c.beginPath();c.moveTo(0,-s);c.bezierCurveTo(s*.25,-s*.45,s*.65,0,s*.65,s*.35);c.arc(0,s*.35,s*.65,0,P);c.bezierCurveTo(-s*.65,0,-s*.25,-s*.45,0,-s);c.fill()},
 cloud(c,s,a){const k=a?.cloud??1;c.beginPath();[[-.5,.15,.42],[0,-.12,.55],[.5,.12,.42],[-.15,.28,.38],[.3,.3,.36]].forEach(([x,y,r])=>{c.moveTo(x*s+r*s*k,y*s);c.arc(x*s,y*s,r*s*k,0,2*P)});c.fill()},
 sun(c,s,a){const r=s*.45,t=a?.t||0;c.beginPath();c.arc(0,0,r,0,2*P);c.fill();for(let i=0;i<10;i++){c.save();c.rotate(i*P/5+t*.3);c.fillRect(-s*.05,-s*.98,s*.1,s*.32);c.restore()}},
 flower(c,s,a){const o=a?.open??.6;for(let i=0;i<6;i++){c.save();c.rotate(i*P/3);c.beginPath();c.ellipse(0,-s*(.3+.28*o),s*.2,s*(.28+.12*o),0,0,2*P);c.fill();c.restore()}
  c.beginPath();c.arc(0,0,s*.22,0,2*P);c.fill()},
 wave(c,s,a){const A=a?.amp??.35,t=a?.t||0;c.beginPath();c.moveTo(-s*1.1,s*.5);for(let x=-1.1;x<=1.1;x+=.05)c.lineTo(x*s,Math.sin(x*3.2+t*2)*A*s-s*.05);c.lineTo(s*1.1,s*.5);c.closePath();c.fill()}
};
const OBJ=[
 {id:"leaf",n:"葉",k:"wind",map:"風速 → 擺動",col:"#6fd36a",pos:[.24,.22],rot:-.55},
 {id:"rain",n:"雨滴",k:"rain",map:"雨量 → 落雨",col:"#57c8ff",pos:[.76,.2],rot:.15},
 {id:"cloud",n:"雲",k:"cloud",map:"雲量 → 大小",col:"#dfe7f2",pos:[.5,.45],rot:0},
 {id:"sun",n:"日",k:"rad",map:"日照 → 光暈",col:"#ffcd3c",pos:[.22,.72],rot:0},
 {id:"flower",n:"花",k:"temp",map:"溫度 → 綻放",col:"#ff86b0",pos:[.78,.68],rot:.3},
 {id:"wave",n:"浪",k:"wind",map:"風速 → 浪高",col:"#2fb4d6",pos:[.5,.88],rot:0}];

/* sample each shape into a point cloud */
const off=document.createElement("canvas");off.width=off.height=280;const oc=off.getContext("2d",{willReadFrequently:true});
OBJ.forEach(o=>{oc.clearRect(0,0,280,280);oc.save();oc.translate(140,140);oc.fillStyle="#fff";shapes[o.id](oc,90,{});oc.restore();
 const d=oc.getImageData(0,0,280,280).data,pts=[];
 for(let y=0;y<280;y+=6)for(let x=(y/6%2)*3;x<280;x+=6)if(d[(y*280+x)*4+3]>128)pts.push({x:(x-140)/90,y:(y-140)/90,r:Math.random()});
 o.pts=pts;o.t0=-99});

/* UI */
const $=id=>document.getElementById(id);
$("metrics").innerHTML=MET.map(([k,l])=>`<div class="m">${l}<span id="v-${k}">–</span><i id="b-${k}"></i></div>`).join("");
$("pads").innerHTML=OBJ.map((o,i)=>`<button class="pad" id="p-${o.id}" style="--c:${o.col}"><kbd>${i+1}</kbd><strong>${o.n}</strong><small>${o.map}</small><small id="pv-${o.id}">–</small></button>`).join("");
const HOLD=3.2,GL=.45,DIS=.8;
const trigger=i=>{const o=OBJ[i],now=performance.now()/1000,e=now-o.t0;o.t0=(e>GL&&e<GL+HOLD)?now-GL:now;
 const b=$("p-"+o.id);b.classList.add("on");clearTimeout(b._t);b._t=setTimeout(()=>b.classList.remove("on"),220)};
OBJ.forEach((o,i)=>$("p-"+o.id).addEventListener("pointerdown",e=>{e.preventDefault();trigger(i)}));
OBJ.forEach((o,i)=>$("p-"+o.id).addEventListener("keydown",e=>{if(e.key=="Enter"||e.key==" "){e.preventDefault();trigger(i)}}));
addEventListener("keydown",e=>{const n=+e.key;if(n>=1&&n<=6&&!e.repeat)trigger(n-1)});
let hour=5,playing=true;
$("hour").addEventListener("input",e=>{hour=+e.target.value});
$("play").addEventListener("click",()=>{playing=!playing;$("play").textContent=playing?"❚❚":"▶"});
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;

/* canvas */
const cv=$("cv"),c=cv.getContext("2d");let W=0,H=0,dpr=1;
const size=()=>{dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr};
const ro=new ResizeObserver(size);ro.observe($("fig"));size();
let drops=[],last=performance.now()/1000,uiT=0;

function anim(o,t){return{t,cloud:.75+.45*norm("cloud",hour),open:norm("temp",hour),amp:.12+.45*norm("wind",hour)}}
function frame(){
 const now=performance.now()/1000,dt=Math.min(.05,now-last);last=now;
 if(playing&&!reduce){hour=(hour+dt*.25)%24;$("hour").value=hour.toFixed(2)}
 const wind=val("wind",hour),radN=norm("rad",hour),s=Math.min(W,H*.9)*.11;
 c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
 c.fillStyle=`rgba(40,70,140,${radN*.18})`;c.fillRect(0,0,W,H);
 OBJ.forEach(o=>{
  const e=now-o.t0,cx=o.pos[0]*W,cy=o.pos[1]*H,a=anim(o,now);
  let sway=o.id=="leaf"?Math.sin(now*(1+wind*.4))*wind*.06:0;
  c.save();c.translate(cx,cy);c.rotate(o.rot+sway);
  const glitch=e>=0&&e<GL,real=e>=GL&&e<GL+HOLD,dis=e>=GL+HOLD&&e<GL+HOLD+DIS;
  let pa=1,ra=0;if(real)pa=0,ra=1;if(dis){const f=(e-GL-HOLD)/DIS;ra=1-f;pa=f}
  if(ra>0){c.globalAlpha=ra;c.fillStyle=o.col;c.shadowColor=o.col;
   c.shadowBlur=o.id=="sun"?20+radN*60:14;
   if(o.id=="sun"){c.globalAlpha=ra*(.35+.65*radN)}
   shapes[o.id](c,s,a);c.shadowBlur=0;
   if(o.id=="flower"){c.fillStyle="#ffd84a";c.beginPath();c.arc(0,0,s*.2,0,2*P);c.fill()}
   if(o.id=="rain"&&real&&Math.random()<dt*(2+val("rain",hour)*14))drops.push({x:cx+(Math.random()-.5)*W*.35,y:cy+s,v:180+Math.random()*120});
   c.globalAlpha=1}
  if(pa>0){
   const jit=(.6+wind*.35)*(glitch?6:1),scat=dis?(1-pa)*18:0;
   c.fillStyle=glitch?"#c8ff4a":"#3d6bff";
   for(const p of o.pts){
    let x=p.x*s+Math.sin(now*2.3+p.r*40)*jit*.5+(p.r-.5)*scat,y=p.y*s+Math.cos(now*1.9+p.r*30)*jit*.4+(p.r*7%1-.5)*scat;
    if(glitch&&p.r>.82)x+=(Math.random()-.5)*s*.5;
    c.globalAlpha=pa*(glitch?.95:.45+p.r*.55);c.fillRect(x-1.2,y-1.2,2.4,2.4)}
   c.globalAlpha=1}
  if(glitch){c.strokeStyle="#c8ff4a";c.lineWidth=1;
   for(let i=0;i<7;i++){const w=s*(.2+Math.random()*.6),h=s*(.15+Math.random()*.5),x=(Math.random()-.5)*s*1.4-w/2,y=(Math.random()-.5)*s*1.6-h/2;
    c.strokeRect(x,y,w,h);if(i<2){c.fillStyle="rgba(200,255,74,.18)";c.fillRect(x,y,w,h)}}}
  c.restore()});
 c.strokeStyle="#7fd4ff";c.lineWidth=1.4;c.globalAlpha=.8;
 drops=drops.filter(d=>{d.y+=d.v*dt;d.x+=wind*6*dt;c.beginPath();c.moveTo(d.x,d.y);c.lineTo(d.x-wind*.8,d.y-10);c.stroke();return d.y<H});
 c.globalAlpha=1;
 if(now-uiT>.15){uiT=now;
  const hh=Math.floor(hour),mm=Math.floor((hour-hh)*60);$("clock").textContent=`${String(hh).padStart(2,"0")}:${String(mm).padStart(2,"0")}`;
  $("sky").textContent=radN>.05?"白天":"夜晚";
  MET.forEach(([k,,u])=>{$("v-"+k).textContent=`${val(k,hour).toFixed(k=="rad"||k=="cloud"?0:1)} ${u}`;$("b-"+k).style.setProperty("--w",norm(k,hour)*100+"%")});
  OBJ.forEach(o=>{const m=MET.find(r=>r[0]==o.k);$("pv-"+o.id).textContent=`${val(o.k,hour).toFixed(o.k=="rad"||o.k=="cloud"?0:1)} ${m[2]}`})}
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
}
</script>
</body>
</html>
